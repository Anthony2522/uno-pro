name: UNO Pro - checagem
on:
  push:
    branches: [main, feature-hard-ai-2026-11-14]
  workflow_dispatch:
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/bot-benchmark.mjs --games=120
      - run: node scripts/bot-benchmark.mjs --enhanced --games=240
      - run: node scripts/bot-benchmark.mjs --paired --games=240
      - run: npm run typecheck
      - run: npm run build
