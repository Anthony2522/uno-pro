name: UNO Pro - checagem
on:
  push:
    branches: [main, 'feature-*', 'fix-*']
  workflow_dispatch:
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: UNO_SELF_PLAY=1 node scripts/hard-self-play.mjs --validate --full --seed=1000000
      - run: node scripts/bot-benchmark.mjs --games=240
      - run: node scripts/bot-benchmark.mjs --enhanced --games=240
      - run: node scripts/bot-benchmark.mjs --paired --games=240
      - run: node scripts/bot-benchmark.mjs --paired --games=40 --repeat-check
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/verify-offline-shell.mjs
